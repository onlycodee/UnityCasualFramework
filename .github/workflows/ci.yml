# HyperFrame CI: architecture gate only. Unity tests run locally (Tools/ci/run-tests.ps1 or run-tests.sh),
# by decision on 2026-10-02 (see docs/DECISIONS.md), so CI needs no Unity license secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture check (no Unity needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tools/ci/check_architecture.py
